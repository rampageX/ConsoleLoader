name: ConsoleLoader Windows x64 build

on:
  push:
    branches:
      - master
      - feature/window-size-highlight
      - fix/close-process-lifetime-0.4
      - 'fix/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
      - name: Build ConsoleLoader
        shell: msys2 {0}
        run: |
          windres ConsoleLoader.rc -O coff -o ConsoleLoader_res.o
          g++ -std=c++17 -O2 -pipe -municode -mwindows ConsoleLoader.cpp ConsoleLoader_res.o -o ConsoleLoader.exe -static-libstdc++ -static-libgcc -lole32 -luuid -lcomctl32 -ldwmapi -lgdi32 -lshell32 -lcomdlg32
      - name: Verify Windows version information
        shell: pwsh
        run: |
          $exe = (Resolve-Path ./ConsoleLoader.exe).Path
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          Write-Host "FileDescription=$($info.FileDescription)"
          Write-Host "FileVersion=$($info.FileVersion)"
          Write-Host "ProductVersion=$($info.ProductVersion)"
          if ($info.FileVersion -ne '0.4.2.0') { throw 'Invalid EXE FileVersion' }
          if ($info.ProductVersion -ne '0.4.2') { throw 'Invalid EXE ProductVersion' }
          if ($info.FileDescription -notlike '*0.4.2*') { throw 'EXE tooltip description lacks version' }
      - name: Compile GUI child process fixture
        shell: msys2 {0}
        run: |
          g++ -std=c++17 -O2 -mwindows tests/KeepAlive.cpp -o TestTray.exe
      - name: Compile argument forwarding fixture
        shell: msys2 {0}
        run: |
          g++ -std=c++17 -O2 -municode tests/ArgCapture.cpp -o ArgCapture.exe
      - name: Verify Send To window-size argument handling
        shell: pwsh
        run: ./tests/sendto-regression.ps1
      - name: Build native settings regression harness
        shell: msys2 {0}
        run: |
          g++ -std=c++17 -O2 -municode tests/SettingsRegression.cpp -o SettingsRegression.exe -static-libstdc++ -static-libgcc -lole32 -luuid -lcomctl32 -ldwmapi -lgdi32 -lshell32 -lcomdlg32
      - name: Verify registry persistence and font/highlight behavior
        shell: pwsh
        run: ./SettingsRegression.exe
      - name: Verify close-window process cleanup
        shell: pwsh
        run: ./tests/close-regression.ps1
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ConsoleLoader-win-x64-test
          path: ConsoleLoader.exe
          if-no-files-found: error

  release:
    # Explicit one-off publication only when the tested PR is merged under
    # the exact release-marked commit message. Never overwrite old releases.
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, 'release: 0.4.2') }}"
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Windows executable
        uses: actions/download-artifact@v4
        with:
          name: ConsoleLoader-win-x64-test
          path: .
      - name: Validate Windows x64 artifact
        run: |
          test -s ConsoleLoader.exe
          file ConsoleLoader.exe | grep -Fq 'PE32+ executable'
          file ConsoleLoader.exe | grep -Fq 'x86-64'
          sha256sum ConsoleLoader.exe
      - name: Publish release 0.4.2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view 0.4.2 >/dev/null 2>&1; then
            echo "::error::Release 0.4.2 already exists. Refusing overwrite."
            exit 1
          fi
          cat > RELEASE_NOTES.md <<'EOF'
          ## ConsoleLoader 0.4.2

          - **Send To compatibility:** accept window size (e.g. `650x400`) immediately after the target executable, so Explorer can append selected media files without interfering with window size parsing.
          - **Backward compatible:** the existing trailing `WIDTHxHEIGHT` syntax still works. File paths with spaces and Unicode and multiple selected files remain forwarded with correct quoting.
          - **No extra console window:** native Win32 GUI launcher continues to use `CREATE_NO_WINDOW`; no intermediary batch wrapper is needed.
          - **Version information:** Explorer tooltip and Properties > Details updated to FileVersion 0.4.2.0 / ProductVersion 0.4.2.
          - Retains previous 0.4.1 fixes: clean process exit, UAC focus restoration, center startup, light/dark scrollbar and output highlighting.

          **Validated:** Windows x64 MSYS2 UCRT64 build, VERSIONINFO check, Send To single/multiple file argument regression, Unicode/special-path handling, invalid size fallback and process-close regression.
          EOF
          gh release create 0.4.2 ConsoleLoader.exe \
            --title "ConsoleLoader 0.4.2" \
            --target "$GITHUB_SHA" \
            --notes-file RELEASE_NOTES.md \
            --latest
