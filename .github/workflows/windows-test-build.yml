name: ConsoleLoader Windows x64 build

on:
  push:
    branches:
      - master
      - feature/window-size-highlight
      - fix/close-process-lifetime-0.4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
      - name: Build ConsoleLoader
        shell: msys2 {0}
        run: |
          windres ConsoleLoader.rc -O coff -o ConsoleLoader_res.o
          g++ -std=c++17 -O2 -pipe -municode -mwindows ConsoleLoader.cpp ConsoleLoader_res.o -o ConsoleLoader.exe -static-libstdc++ -static-libgcc -lole32 -luuid -lcomctl32 -ldwmapi -lgdi32 -lshell32
      - name: Verify Windows version information
        shell: pwsh
        run: |
          $exe = (Resolve-Path ./ConsoleLoader.exe).Path
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          Write-Host "FileDescription=$($info.FileDescription)"
          Write-Host "FileVersion=$($info.FileVersion)"
          Write-Host "ProductVersion=$($info.ProductVersion)"
          if ($info.FileVersion -ne '0.4.1.0') { throw 'Invalid EXE FileVersion' }
          if ($info.ProductVersion -ne '0.4.1') { throw 'Invalid EXE ProductVersion' }
          if ($info.FileDescription -notlike '*0.4.1*') { throw 'EXE tooltip description lacks version' }
      - name: Compile GUI child process fixture
        shell: msys2 {0}
        run: |
          g++ -std=c++17 -O2 -mwindows tests/KeepAlive.cpp -o TestTray.exe
      - name: Verify close-window process cleanup
        shell: pwsh
        run: ./tests/close-regression.ps1
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ConsoleLoader-win-x64-test
          path: ConsoleLoader.exe
          if-no-files-found: error

  release:
    # Explicit one-off publication only when the tested PR is merged under
    # the exact release-marked commit message. Never overwrite old releases.
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, 'release: 0.4.1') }}"
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Windows executable
        uses: actions/download-artifact@v4
        with:
          name: ConsoleLoader-win-x64-test
          path: .
      - name: Validate Windows x64 artifact
        run: |
          test -s ConsoleLoader.exe
          file ConsoleLoader.exe | grep -Fq 'PE32+ executable'
          file ConsoleLoader.exe | grep -Fq 'x86-64'
          sha256sum ConsoleLoader.exe
      - name: Publish release 0.4.1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view 0.4.1 >/dev/null 2>&1; then
            echo "::error::Release 0.4.1 already exists. Refusing overwrite."
            exit 1
          fi
          cat > RELEASE_NOTES.md <<'EOF'
          ## ConsoleLoader 0.4.1

          - **Version details:** Explorer mouse-hover information and EXE Properties > Details now include FileVersion 0.4.1.0, ProductVersion 0.4.1 and a versioned file description.
          - **Exit cleanup:** closing ConsoleLoader while CMD is running now cancels the blocked pipe reader and closes its handles safely; independently launched applications such as Proxifier stay running.
          - **UAC focus:** the elevated ConsoleLoader window restores foreground focus after UAC consent without staying always-on-top.
          - Retains the 0.4 window-size argument, title-bar size copying, centered startup, conditional dark scrollbar, status highlighting and UTF-8/OEM support.

          **Validation:** MSYS2 UCRT64 x64 build, Windows VERSIONINFO verification and real Win32 process lifetime regression.
          EOF
          gh release create 0.4.1 ConsoleLoader.exe \
            --title "ConsoleLoader 0.4.1" \
            --target "$GITHUB_SHA" \
            --notes-file RELEASE_NOTES.md \
            --latest
